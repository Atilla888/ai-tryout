stages:
  - validate
  - lint

check-project-structure:
  stage: validate
  image: alpine:latest
  script:
    - test -f README.md
    - test -f .gitlab-ci.yml
    - test -f .env.example
    - test -f docker-compose.yml
    - test -d docs
    - test -d apps
    - test -d apps/backend-api
    - test -d apps/frontend
    - test -d apps/orchestrator
    - test -d models/common-runner-template
    - test -d infra/docker
    - test -d infra/k8s
    - test -d tests/e2e
    - echo "Repository structure is valid"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

validate-docker-compose:
  stage: validate
  image: docker:27-cli
  script:
    - docker compose version
    - cp .env.example .env
    - docker compose -f docker-compose.yml config
    - echo "docker-compose.yml is valid"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

lint:backend:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check apps/backend-api/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

lint:frontend:
  stage: lint
  image: node:20-slim
  script:
    - |
      if [ -f apps/frontend/package.json ]; then
        cd apps/frontend && npm ci --silent && npm run lint
      else
        echo "Frontend not scaffolded yet — skipping"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
