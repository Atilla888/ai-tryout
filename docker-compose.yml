services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: ai_spaces_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aispacesuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aispacespass}
      POSTGRES_DB: ${POSTGRES_DB:-aispaces}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    container_name: ai_spaces_keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --hostname=http://localhost:8080
      - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/k8s/keycloak/ai-spaces-realm.json:/opt/keycloak/data/import/ai-spaces-realm.json:ro

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: ai-spaces-backend:dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aispacesuser}:${POSTGRES_PASSWORD:-aispacespass}@postgres:5432/${POSTGRES_DB:-aispaces}
      ALEMBIC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aispacesuser}:${POSTGRES_PASSWORD:-aispacespass}@postgres:5432/${POSTGRES_DB:-aispaces}

      AUTH_PROVIDER: oidc
      OIDC_ISSUER: http://localhost:8080/realms/ai-spaces
      OIDC_JWKS_URL: http://keycloak:8080/realms/ai-spaces/protocol/openid-connect/certs
      OIDC_CLIENT_ID: ai-spaces-frontend
      OIDC_ALGORITHM: RS256
      OIDC_VERIFY_AUDIENCE: "false"

      ARTIFACT_STORAGE_ROOT: /app/storage
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-changeme-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./apps/backend:/app
      - storage_data:/app/storage

  orchestrator:
    build:
      context: ./apps/orchestrator
      dockerfile: Dockerfile
    image: ai-spaces-orchestrator:dev
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-changeme-internal-token}
      # subprocess backend runs the bundled reference/fake runner; switch to
      # "kubernetes" (with cluster access + K8S_NAMESPACE) for real workloads.
      RUNNER_BACKEND: ${RUNNER_BACKEND:-subprocess}
      RUNNER_SCRIPT: /app/fake_runner.py
      CONCURRENCY_LIMIT: "2"
      POLL_INTERVAL_SECONDS: "3"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./apps/orchestrator:/app

volumes:
  postgres_data:
  storage_data:
  keycloak_data: