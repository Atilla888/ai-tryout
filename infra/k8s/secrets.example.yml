# =============================================================================
# AI-Spaces — Kubernetes Secrets TEMPLATE
#
# The real Secret manifests live in `infra/k8s/secrets/`, which is gitignored,
# so a fresh clone will NOT contain them. This template documents every Secret
# the manifests expect, and which keys each one must define.
#
# ── Setup (each teammate, once per cluster) ─────────────────────────────────
#   1. mkdir -p infra/k8s/secrets
#   2. cp infra/k8s/secrets.example.yml infra/k8s/secrets/secrets.yml
#   3. Replace every REPLACE_ME value below with a real value.
#   4. kubectl apply -f infra/k8s/secrets/secrets.yml
#
# The values here are PLACEHOLDERS — never commit real secrets. `stringData`
# lets you write plain text; Kubernetes base64-encodes it for you on apply.
#
# Generate strong random values, e.g.:
#   openssl rand -hex 32          # tokens / passwords
# =============================================================================

# -----------------------------------------------------------------------------
# 1) postgres-secret
#    Consumed by: infra/k8s/postgres.yml (StatefulSet env: POSTGRES_*)
#    These same values must match the credentials embedded in the DATABASE_URL /
#    ALEMBIC_DATABASE_URL of backend-secret below.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ai-spaces
type: Opaque
stringData:
  POSTGRES_USER: aispacesuser
  POSTGRES_PASSWORD: REPLACE_ME_db_password
  POSTGRES_DB: aispaces

---
# -----------------------------------------------------------------------------
# 2) keycloak-secret
#    Consumed by: infra/k8s/keycloak/keycloak.yml (envFrom -> bootstrap admin)
#    Bootstraps the Keycloak master-realm admin account on first startup.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: ai-spaces
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: REPLACE_ME_keycloak_admin_password

---
# -----------------------------------------------------------------------------
# 3) backend-secret
#    Consumed by: infra/k8s/backend.yml   (backend container + migrate-db init,
#                                          both via envFrom)
#                 infra/k8s/orchestrator.yml (reads INTERNAL_SERVICE_TOKEN only)
#
#    - DATABASE_URL uses the async driver (asyncpg) — used by the app.
#    - ALEMBIC_DATABASE_URL uses the sync driver (psycopg) — used by the
#      `alembic upgrade head` migration init container.
#    - The user:password@host/db inside both URLs MUST match postgres-secret
#      (user=aispacesuser, db=aispaces) and the in-cluster host is the Postgres
#      Service name `postgres` on port 5432.
#    - INTERNAL_SERVICE_TOKEN is the shared secret for backend <-> orchestrator
#      calls; the SAME value is read by the orchestrator, so it must match.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: ai-spaces
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://aispacesuser:REPLACE_ME_db_password@postgres:5432/aispaces
  ALEMBIC_DATABASE_URL: postgresql+psycopg://aispacesuser:REPLACE_ME_db_password@postgres:5432/aispaces
  INTERNAL_SERVICE_TOKEN: REPLACE_ME_shared_internal_token