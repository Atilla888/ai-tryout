<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARA – Spaces</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #f6f7fb; color: #1a1a1a; min-height: 100vh; }

    .sara-nav {
      background: #fff;
      border-bottom: 3px solid #f5c030;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 72px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .sara-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .hof-logo {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hof-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .sara-brand-text { display: flex; flex-direction: column; line-height: 1.1; }
    .sara-brand-name { font-size: 18px; font-weight: 800; color: #1a1a1a; }
    .sara-brand-sub { font-size: 11px; color: #6e7280; letter-spacing: 0.02em; }

    .sara-nav-links { display: flex; gap: 28px; margin-left: 36px; font-size: 14px; }
    .sara-nav-link { color: #525252; text-decoration: none; font-weight: 700; transition: color .15s; }
    .sara-nav-link:hover,
    .sara-nav-link.active { color: #1a1a1a; }

    .sara-nav-right { display: flex; align-items: center; }
    .sara-signin {
      border-radius: 999px;
      border: none;
      background: #f5c030;
      color: #412402;
      padding: 10px 22px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .sara-signin:hover { background: #e6b52b; transform: translateY(-1px); }

    .sara-content { max-width: 1360px; margin: 0 auto; padding: 28px 24px; }
    .sara-section-card { background: #fff; border-radius: 20px; border: 1px solid #e6e7eb; overflow: hidden; }
    .sara-section-header { padding: 24px 24px 12px; display: flex; align-items: center; gap: 10px; }
    .sara-section-title { font-size: 18px; font-weight: 800; color: #1a1a1a; }
    .sara-hero { padding: 0 24px 20px; color: #444; }
    .sara-hero p { max-width: 720px; font-size: 15px; line-height: 1.75; color: #6e7280; margin-top: 8px; }

    .search-filter-bar { padding: 0 24px 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .sara-search {
      flex: 1; max-width: 380px; padding: 12px 16px;
      border: 1px solid #ddd; border-radius: 999px; font-size: 14px;
      color: #333; background: #fafafa; outline: none;
    }
    .sara-search:focus { border-color: #f5c030; background: #fff; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 7px 18px; border-radius: 999px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: 1px solid #ddd; background: #fff; color: #555;
      transition: all .15s; user-select: none;
    }
    .chip:hover { border-color: #aaa; color: #333; }
    .chip.on { background: #f5c030; border-color: #f5c030; color: #412402; }

    .count-label { font-size: 13px; color: #9ca3af; padding: 0 24px 14px; }
    .spaces-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; padding: 0 24px 24px; }

    .space-card {
      background: #fff; border: 1px solid #e6e7eb; border-radius: 18px;
      padding: 24px; cursor: pointer; transition: border-color .15s, box-shadow .15s;
      display: flex; flex-direction: column; min-height: 220px;
    }
    .space-card:hover { border-color: #f5c030; box-shadow: 0 10px 30px rgba(245,192,48,.12); }

    .sc-name { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 10px; line-height: 1.3; }
    .sc-desc { font-size: 13px; color: #6e7280; line-height: 1.7; margin-bottom: 18px; flex: 1; }
    .sc-badges { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }

    .pill { display: inline-flex; align-items: center; justify-content: center; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; }
    .pill-audio { background: #22a06b; }
    .pill-video { background: #7c3aed; }
    .pill-3d    { background: #db2777; }
    .pill-image { background: #dc2626; }
    .pill-text  { background: #2563eb; }

    .sc-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 16px; border-top: 1px solid #f1f2f4;
    }
    .sc-meta { font-size: 12px; color: #9ca3af; }
    .btn-open {
      background: #f5c030; border: 1px solid #f5c030; border-radius: 999px;
      padding: 10px 22px; font-size: 13px; font-weight: 700; color: #412402;
      cursor: pointer; transition: background .15s, transform .15s;
    }
    .btn-open:hover { background: #e6b52b; transform: translateY(-1px); }

    .empty-state { grid-column: 1/-1; text-align: center; padding: 3rem; color: #9ca3af; }
    .empty-state p { font-size: 14px; margin-bottom: 12px; }
    .btn-reset {
      background: #f5c030; border: none; border-radius: 999px;
      padding: 10px 22px; font-size: 13px; font-weight: 700; color: #412402; cursor: pointer;
    }

    @media (max-width: 1100px) {
      .spaces-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="sara-nav">
  <a class="sara-brand" href="dashboard.html">
    <div class="hof-logo">
      <img src="logo.png" alt="SARA logo" />
    </div>
    <div class="sara-brand-text">
      <span class="sara-brand-name">SARA</span>
      <span class="sara-brand-sub">System for AI-Research &amp; Assessment</span>
    </div>
  </a>

  <div class="sara-nav-links">
    <a class="sara-nav-link" href="#">Browse</a>
    <a class="sara-nav-link" href="#">Projects</a>
    <a class="sara-nav-link" href="#">Datasets</a>
    <a class="sara-nav-link" href="#">Models</a>
    <a class="sara-nav-link" href="#">Leaderboards</a>
    <a class="sara-nav-link" href="#">Evaluations</a>
    <a class="sara-nav-link active" href="spaces.html">Spaces</a>
    <a class="sara-nav-link" href="#">Groups</a>
  </div>

  <div class="sara-nav-right">
    <button class="sara-signin" onclick="handleAuth()">Sign In</button>
  </div>
</nav>

<div class="sara-content">
  <div class="sara-section-card">
    <div class="sara-section-header">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#555" stroke-width="1.5">
        <rect x="1" y="1" width="6" height="6" rx="1"/>
        <rect x="9" y="1" width="6" height="6" rx="1"/>
        <rect x="1" y="9" width="6" height="6" rx="1"/>
        <rect x="9" y="9" width="6" height="6" rx="1"/>
      </svg>
      <span class="sara-section-title">Spaces</span>
    </div>
    <div class="sara-hero">
      <p>Browse the available AI spaces in your SARA dashboard. Select a space to open the job interface, review input options and monitor queue status.</p>
    </div>

    <div class="search-filter-bar">
      <input class="sara-search" id="searchInp" type="text" placeholder="Search spaces..." oninput="render()">
      <div class="chips" id="chips"></div>
    </div>

    <div class="count-label" id="countLabel"></div>
    <div class="spaces-grid" id="grid"></div>
  </div>
</div>

<script>
const SPACES = [
  { id:1, name:"AceStep 1.5 – Music Generator", desc:"Generate music from a text prompt and style parameters. Output is a downloadable audio file.", task:"Audio", input:"Text", output:"Audio", date:"27.4.2026", queue:2 },
  { id:2, name:"LTX 2.3 – Video Generator",      desc:"Generate short videos from text prompts using LTX 2.3. Custom duration and resolution supported.", task:"Video", input:"Text", output:"Video", date:"27.4.2026", queue:0 },
  { id:3, name:"SAM 3D – Object Generator",       desc:"Create interactive 3D models from images using SAM. Output is a GLB file previewable in-browser.", task:"3D", input:"Image", output:"3D", date:"27.4.2026", queue:1 },
];

const PILL = { Audio:"pill-audio", Video:"pill-video", "3D":"pill-3d", Image:"pill-image", Text:"pill-text" };
const FILTERS = ["All","Audio","Video","3D","Image","Text"];
let activeFilter = "All";

const chipsEl = document.getElementById("chips");
FILTERS.forEach(f => {
  const c = document.createElement("span");
  c.className = "chip" + (f === "All" ? " on" : "");
  c.textContent = f;
  c.addEventListener("click", () => {
    activeFilter = f;
    document.querySelectorAll(".chip").forEach((el, i) => el.className = "chip" + (FILTERS[i] === f ? " on" : ""));
    render();
  });
  chipsEl.appendChild(c);
});

function render() {
  const q = document.getElementById("searchInp").value.toLowerCase();
  const filtered = SPACES.filter(s =>
    (activeFilter === "All" || s.task === activeFilter) &&
    (!q || s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q) || s.task.toLowerCase().includes(q))
  );
  document.getElementById("countLabel").textContent = filtered.length + " space" + (filtered.length !== 1 ? "s" : "") + " available";
  const grid = document.getElementById("grid");
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><p>No spaces match your search.</p><button class="btn-reset" onclick="resetFilters()">Clear filters</button></div>`;
    return;
  }
  grid.innerHTML = filtered.map(s => `
    <div class="space-card" onclick="window.location.href='space-detail.html?id=${s.id}'">
      <div class="sc-name">${s.name}</div>
      <div class="sc-desc">${s.desc}</div>
      <div class="sc-badges">
        <span class="pill ${PILL[s.task]}">${s.task}</span>
        <span class="pill ${PILL[s.input]}">${s.input} in</span>
        <span class="pill ${PILL[s.output]}">${s.output} out</span>
      </div>
      <div class="sc-footer">
        <span class="sc-meta">${s.date} · ${s.queue > 0 ? s.queue + " in queue" : "Available"}</span>
        <button class="btn-open" onclick="event.stopPropagation(); window.location.href='space-detail.html?id=${s.id}'">Open</button>
      </div>
    </div>`).join("");
}

function resetFilters() {
  activeFilter = "All";
  document.getElementById("searchInp").value = "";
  document.querySelectorAll(".chip").forEach((el, i) => el.className = "chip" + (i === 0 ? " on" : ""));
  render();
}

function handleAuth() {
  if (localStorage.getItem("jwt_token")) {
    localStorage.removeItem("jwt_token");
    localStorage.removeItem("username");
    location.reload();
  } else {
    window.location.href = "signin.html";
  }
}

render();
</script>
</body>
</html>
