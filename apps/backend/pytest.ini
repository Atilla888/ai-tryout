# pytest.ini — root-level pytest configuration for AI-Spaces-Tryout (Hof Spaces)

[pytest]
# Default test paths
testpaths = tests

# Async mode: auto — every async test function is treated as a coroutine
asyncio_mode = auto

# Markers
markers =
    integration: marks tests as integration tests (require a running test DB)
    unit: marks tests as unit tests (no external dependencies)

# Show short test summary for failures and errors
addopts =
    -v
    --tb=short
    -p no:warnings

# Minimum pytest version
minversion = 7.0